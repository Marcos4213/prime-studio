<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Central do Cliente — Prime Studio</title>
<meta name="theme-color" content="#0b0a08">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v=1">
</head>
<body>
<div id="app" class="app" hidden></div>

<!-- Tela de login -->
<main id="loginView" class="login">
  <div class="login-card">
    <div class="brand"><span class="logo">PRIME<span>STUDIO</span></span></div>
    <h1>Central do <em>Cliente</em></h1>
    <p class="sub">Seu lugar para criar conteúdo todo dia, no tom da sua clínica.</p>
    <form id="loginForm" class="form" autocomplete="on">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="voce@suaclinica.com">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      <button class="btn" type="submit">Entrar</button>
      <p id="loginErr" class="err" hidden></p>
    </form>
    <p class="fine">Acesso fornecido pela Prime Studio. Seus acessos continuam sendo seus.</p>
  </div>
</main>

<template id="appShell">
  <header class="top">
    <span class="logo">PRIME<span>STUDIO</span></span>
    <div class="top-right">
      <span class="who" data-who></span>
      <button class="btn-ghost btn-xs" data-logout>Sair</button>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab is-active" data-tab="estudio">Estúdio</button>
    <button class="tab" data-tab="marca">Marca</button>
    <button class="tab" data-tab="historico">Histórico</button>
  </nav>
  <main class="views">
    <section class="view is-active" data-view="estudio"></section>
    <section class="view" data-view="marca"></section>
    <section class="view" data-view="historico"></section>
  </main>
</template>

<script src="/assets/app.js?v=1" defer></script>
</body>
</html>
